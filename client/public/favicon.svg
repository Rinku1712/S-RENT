<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="srFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="55%" stop-color="#E93636" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <filter id="srFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E93636" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Red Squircle Icon Background -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#srFaviconGrad)" filter="url(#srFaviconGlow)"/>
  
  <!-- Subtle Top Highlight Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- "SR" Monogram Typography -->
  <text x="32" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" letter-spacing="-0.06em" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SR</text>
</svg>
