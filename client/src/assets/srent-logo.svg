<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" fill="none">
  <defs>
    <linearGradient id="srLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="55%" stop-color="#E93636" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <filter id="srLogoShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E93636" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Red Squircle Icon Box with "SR" Monogram -->
  <rect x="10" y="10" width="70" height="70" rx="20" fill="url(#srLogoGrad)" filter="url(#srLogoShadow)"/>
  <!-- Inset highlight ring -->
  <rect x="11" y="11" width="68" height="68" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2"/>
  <!-- "SR" Monogram -->
  <text x="45" y="47.5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.06em" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SR</text>

  <!-- Brand Name Typography: S-RENT -->
  <text x="98" y="39" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#171717" letter-spacing="-0.03em" dominant-baseline="central">S<tspan fill="#E93636">-RENT</tspan></text>

  <!-- Official Tagline Typography -->
  <text x="100" y="67" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#737373" letter-spacing="0.08em" dominant-baseline="central">SAB RENT PAR, SASTE RENT PAR</text>
</svg>
