<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90" fill="none">
  <defs>
    <linearGradient id="srentRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E53935" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Red Logo Icon Box with S -->
  <rect x="10" y="10" width="70" height="70" rx="18" fill="url(#srentRedGrad)" filter="url(#cardShadow)"/>
  <text x="45" y="47" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">S</text>

  <!-- Brand Name Typography -->
  <text x="96" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#0F172A" letter-spacing="-0.03em" dominant-baseline="central">S<tspan fill="#E53935">-RENT</tspan></text>

  <!-- Slogan Typography -->
  <text x="98" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.06em" dominant-baseline="central">SAB RENT PAR, SASTE RENT PAR</text>
</svg>
